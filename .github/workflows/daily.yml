name: Daily Math Puzzle Automation

on:
  schedule:
    # প্রতি ৫ ঘণ্টা পর পর স্বয়ংক্রিয়ভাবে চলবে
    - cron: '0 */5 * * *'
  workflow_dispatch: # টেস্ট বাটন

jobs:
  send-puzzle:
    runs-on: ubuntu-latest
    steps:
      - name: কোড ডাউনলোড করা
        uses: actions/checkout@v4

      - name: পাইথন সেটআপ করা
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: লাইব্রেরি ইনস্টল করা
        run: pip install requests

      - name: স্ক্রিপ্ট রান করা
        env:
          ollama: ${{ secrets.ollama || vars.ollama }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_ID: ${{ secrets.WHATSAPP_PHONE_ID }}
          WHATSAPP_TO: ${{ secrets.WHATSAPP_TO }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
