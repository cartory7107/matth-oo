name: Daily Math Puzzle Automation

on:
  schedule:
    # প্রতিদিন বাংলাদেশ সময় সকাল ৯টায় (UTC 3:00 AM)
    - cron: '0 3 * * *'
  workflow_dispatch: # ম্যানুয়ালি টেস্ট চালানোর বাটন

jobs:
  send-puzzle:
    runs-on: ubuntu-latest
    steps:
      - name: কোড ডাউনলোড করা
        uses: actions/checkout@v4

      - name: পাইথন সেটআপ করা
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: লাইব্রেরি ইনস্টল করা
        run: pip install requests

      - name: স্ক্রিপ্ট রান করা
        env:
          ollama: ${{ secrets.ollama || vars.ollama }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_ID: ${{ secrets.WHATSAPP_PHONE_ID }}
          WHATSAPP_TO: ${{ secrets.WHATSAPP_TO }}
        run: python main.py
